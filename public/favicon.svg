<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAFBFF" />
      <stop offset="40%" stop-color="#00D9FF" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#03070D" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#03070D" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.4" stroke-dasharray="6,4" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="#73EEFF" stroke-width="3" filter="url(#glow)" />
  <circle cx="50" cy="50" r="18" fill="url(#arcGlow)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="8" fill="#FFFFFF" />
  <!-- Arc Reactor Segments -->
  <line x1="50" y1="12" x2="50" y2="24" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="76" x2="50" y2="88" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" />
  <line x1="12" y1="50" x2="24" y2="50" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" />
  <line x1="76" y1="50" x2="88" y2="50" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" />
</svg>
